[project]
name = "event-album-backend"
version = "0.1.0"
description = "FastAPI backend for event-album face recognition platform"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "boto3>=1.34.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.24.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.1",
    "greenlet>=3.0.3",
    "pillow>=10.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
